name: apply-ez1-compat-fixes

on:
  push:
    branches:
      - feat/ez1-unique-units-v2

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply source compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          npc = Path('game/server/ai_basenpc.cpp')
          text = npc.read_text()
          old = '#include "sprite.h"'
          new = '#include "Sprite.h"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected sprite include was not found')
          npc.write_text(text)

          apc = Path('game/server/Human_Error/vehicle_drivable_apc.cpp')
          text = apc.read_text()

          declaration = 'int HLSS_SelectTargetType(CBaseEntity *pEntity);'
          helper = '''int HLSS_SelectTargetType(CBaseEntity *pEntity);

static Disposition_t PlayerDispositionToClass( Class_T targetClass )
{
\tCBasePlayer *pPlayer = UTIL_GetLocalPlayer();
\treturn pPlayer ? pPlayer->GetDefaultRelationshipDisposition( targetClass ) : D_NU;
}'''
          if helper not in text:
              if declaration not in text:
                  raise SystemExit('APC helper insertion point was not found')
              text = text.replace(declaration, helper, 1)

          replacements = {
              'CBaseCombatCharacter::GetDefaultRelationshipDispositionBetweenClasses( CLASS_PLAYER, info.GetAttacker()->Classify() )':
                  'PlayerDispositionToClass( info.GetAttacker()->Classify() )',
              'CBaseCombatCharacter::GetDefaultRelationshipDispositionBetweenClasses( CLASS_PLAYER, tr.m_pEnt->Classify() )':
                  'PlayerDispositionToClass( tr.m_pEnt->Classify() )',
              'if (!DoesLaserDotHaveTarget( m_hLaserDot ))':
                  'if ( m_flLaserTargetTime < gpGlobals->curtime )',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected APC expression was not found: {old}')
          apc.write_text(text)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game/server/ai_basenpc.cpp game/server/Human_Error/vehicle_drivable_apc.cpp
          git commit -m "Fix EZ1 sprite and APC compatibility"
          git push origin HEAD:feat/ez1-unique-units-v2

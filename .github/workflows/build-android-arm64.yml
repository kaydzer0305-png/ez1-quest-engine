name: build-android-arm64

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_games:
        description: 'waf --build-games value (manual builds default to hl2; pull requests validate ez1)'
        required: false
        default: 'hl2'

permissions:
  contents: read
  pull-requests: write

jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK r20b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
          unzip -q android-ndk-r20b-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r20b" >> "$GITHUB_ENV"

      - name: Fetch OpenXR loader (Khronos AAR)
        env:
          OPENXR_AAR_VERSION: "1.0.34"
        run: |
          set -e
          AAR="openxr_loader_for_android-${OPENXR_AAR_VERSION}.aar"
          MAVEN_SCHEME=https
          MAVEN_HOST=repo1.maven.org
          MAVEN_PATH="maven2/org/khronos/openxr/openxr_loader_for_android/${OPENXR_AAR_VERSION}/${AAR}"
          wget -q "${MAVEN_SCHEME}://${MAVEN_HOST}/${MAVEN_PATH}"
          unzip -q "${AAR}" -d openxr-aar
          INC=$(dirname "$(find openxr-aar -name openxr.h | head -1)")
          SO="openxr-aar/prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so"
          test -n "$INC" || { echo 'openxr.h not found in AAR'; exit 1; }
          test -f "$SO" || { echo "arm64-v8a libopenxr_loader.so not found at $SO"; find openxr-aar -name 'libopenxr_loader.so'; exit 1; }
          mkdir -p external/openxr/include/openxr external/openxr/lib/aarch64
          cp "$INC"/*.h external/openxr/include/openxr/
          cp "$SO" external/openxr/lib/aarch64/
          ls -la external/openxr/include/openxr external/openxr/lib/aarch64
          python3 -c 'import struct; d=open("external/openxr/lib/aarch64/libopenxr_loader.so","rb").read(64); assert d[:4]==b"\x7fELF"; m=struct.unpack_from("<H",d,18)[0]; print("ELF e_machine",m); assert m==183, m'

      - name: Select game profile
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GAMES=ez1
          else
            GAMES="${{ github.event.inputs.build_games }}"
            if [ -z "$GAMES" ]; then GAMES=hl2; fi
          fi
          echo "GAMES=$GAMES" >> "$GITHUB_ENV"
          echo "Selected --build-games=$GAMES"

      - name: Configure
        id: configure
        continue-on-error: true
        run: |
          set -o pipefail
          ./waf configure -T release --android=aarch64,4.9,24 --togles --disable-warns --build-games="$GAMES" 2>&1 | tee configure.log

      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./waf build 2>&1 | tee build.log

      - name: Report EZ1 failure
        if: always() && github.event_name == 'pull_request' && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## EZ1 Android build failure'
            echo
            echo 'The tail of the configure/build log is below:'
            echo
            echo '```text'
            if [ -f build.log ]; then tail -n 120 build.log; else tail -n 120 configure.log; fi
            echo '```'
          } > pr-build-failure.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-build-failure.md

      - name: Stop after configure/build failure
        if: always() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure')
        run: exit 1

      - name: Build hidapi stub
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          mkdir -p apk/lib/arm64-v8a
          "$CC" -shared -fPIC -O1 android/native/hidapi_stub.c -o apk/lib/arm64-v8a/libhidapi.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d apk/lib/arm64-v8a/libhidapi.so | head -8

      - name: Collect native libraries
        run: |
          set -x
          mkdir -p apk/lib/arm64-v8a
          find build -name '*.so' -print0 | xargs -0 -r -I{} cp {} apk/lib/arm64-v8a/
          cp lib/android/aarch64/libSDL2.so apk/lib/arm64-v8a/
          cp external/openxr/lib/aarch64/libopenxr_loader.so apk/lib/arm64-v8a/
          LIBCXX=$(find "$ANDROID_NDK_HOME" \( -path '*arm64*' -o -path '*aarch64*' \) -name 'libc++_shared.so' | head -1)
          if [ -z "$LIBCXX" ]; then LIBCXX=$(find "$ANDROID_NDK_HOME" -name 'libc++_shared.so' | head -1); fi
          echo "libc++_shared found at: $LIBCXX"
          cp "$LIBCXX" apk/lib/arm64-v8a/
          ls -la apk/lib/arm64-v8a

      - name: Package APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_SDK_ROOT"/platforms/android-* | sort -V -t- -k2 | tail -1)
          echo "build-tools: $BT  platform: $PLAT"
          mkdir -p work/classes
          javac -classpath "$PLAT/android.jar" -d work/classes $(find android/java thirdparty/SDL-src/android-project/app/src/main/java -name '*.java')
          "$BT/d8" --release --lib "$PLAT/android.jar" --output work $(find work/classes -name '*.class')
          "$BT/aapt2" link --manifest android/manifest/AndroidManifest.xml -I "$PLAT/android.jar" \
              --min-sdk-version 29 --target-sdk-version 34 \
              -o work/base.apk
          ( cd work && zip -q base.apk classes.dex )
          ( cd apk && zip -qr ../work/base.apk lib )
          "$BT/zipalign" -f 4 work/base.apk SourceQuest.apk
          keytool -genkeypair -keystore work/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -validity 10000
          "$BT/apksigner" sign --ks work/debug.keystore --ks-pass pass:android --key-pass pass:android \
              --out SourceQuest.apk SourceQuest.apk
          ls -la SourceQuest.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SourceQuest-apk
          path: SourceQuest.apk
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        run: tar czf logs.tar.gz $(find . -maxdepth 3 -name '*.log' -not -path './.git/*' | head -20) || true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs.tar.gz
          if-no-files-found: ignore

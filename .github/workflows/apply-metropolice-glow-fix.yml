name: apply-metropolice-glow-fix

on:
  push:
    branches:
      - feat/ez1-unique-units-v2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Move EZ eye-glow methods outside schedule registration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/server/hl2/npc_metropolice.cpp')
          text = path.read_text()
          block = '''#ifdef EZ
          CAI_BaseNPC::EyeGlow_t *CNPC_MetroPolice::GetEyeGlowData( int i )
          {
          \tif ( i != 0 )
          \t\treturn NULL;

          \tstatic CAI_BaseNPC::EyeGlow_t eyeGlow;
          \teyeGlow.spriteName = "sprites/light_glow02.vmt";
          \teyeGlow.attachment = "eyes";
          \teyeGlow.alpha = 100;
          \teyeGlow.red = 0;
          \teyeGlow.green = 255;
          \teyeGlow.blue = 255;
          \teyeGlow.scale = 0.3f;
          \teyeGlow.proxyScale = 3.0f;
          \teyeGlow.renderMode = kRenderGlow;
          \treturn &eyeGlow;
          }

          int CNPC_MetroPolice::GetNumGlows()
          {
          \tif ( m_nSkin == 1 )
          \t\treturn 1;
          \treturn 0;
          }
          #endif'''
          anchor = 'AI_END_CUSTOM_NPC()'
          old = block + '\n\n' + anchor
          new = anchor + '\n\n' + block
          if old not in text:
              if new in text:
                  print('Metropolice glow methods are already in the correct location.')
                  raise SystemExit(0)
              raise SystemExit('Expected metropolice eye-glow block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game/server/hl2/npc_metropolice.cpp
          git commit -m "Fix EZ metropolice eye-glow method placement"
          git push origin HEAD:feat/ez1-unique-units-v2

name: Apply Bullsquid compatibility fixes

on:
  push:
    branches:
      - feat/ez1-unique-units-v2
    paths:
      - .github/workflows/apply-bullsquid-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ez1-unique-units-v2
      - name: Apply compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("game/server/ez2/npc_basepredator.h")
          text = header.read_text()
          marker = "enum WanderState\n{\n\tWANDER_STATE_NEVER = 0,\n\tWANDER_STATE_ALWAYS,\n\tWANDER_STATE_ALERT_ONLY,\n\tWANDER_STATE_IDLE_ONLY\n};"
          replacement = marker + "\n\n// Local compatibility copy of the EZ2 predator variants.\nenum PredatorVariant\n{\n\tEZ_VARIANT_DEFAULT = 0,\n\tEZ_VARIANT_XEN,\n\tEZ_VARIANT_RAD\n};"
          if marker not in text:
              raise SystemExit("Variant enum insertion target not found")
          text = text.replace(marker, replacement, 1)
          marker = "protected:\n\tbool  m_fCanThreatDisplay;"
          replacement = "protected:\n\tint m_tEzVariant; // EZ2 normally provides this in its AI base class.\n\tbool  m_fCanThreatDisplay;"
          if marker not in text:
              raise SystemExit("Variant member insertion target not found")
          header.write_text(text.replace(marker, replacement, 1))

          base = Path("game/server/ez2/npc_basepredator.cpp")
          text = base.read_text()
          marker = "BEGIN_DATADESC( CNPC_BasePredator )\n"
          replacement = marker + "\tDEFINE_KEYFIELD( m_tEzVariant, FIELD_INTEGER, \"ezvariant\" ),\n"
          if marker not in text:
              raise SystemExit("Variant datadesc insertion target not found")
          text = text.replace(marker, replacement, 1)
          marker = "CNPC_BasePredator::CNPC_BasePredator()\n{\n"
          replacement = marker + "\tm_tEzVariant = EZ_VARIANT_DEFAULT;\n"
          if marker not in text:
              raise SystemExit("Variant initialization target not found")
          base.write_text(text.replace(marker, replacement, 1))

          squid = Path("game/server/ez2/npc_bullsquid.cpp")
          text = squid.read_text()
          if "BLOOD_COLOR_BLUE" not in text or "return CLASS_BULLSQUID;" not in text:
              raise SystemExit("Bullsquid compatibility targets not found")
          text = text.replace("BLOOD_COLOR_BLUE", "BLOOD_COLOR_GREEN", 1)
          text = text.replace("return CLASS_BULLSQUID;", "return CLASS_ANTLION;", 1)
          squid.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/server/ez2/npc_basepredator.h game/server/ez2/npc_basepredator.cpp game/server/ez2/npc_bullsquid.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Bullsquid compatibility with the Android engine"
          git push origin HEAD:feat/ez1-unique-units-v2
name: Apply Manhack and predator compatibility fixes

on:
  push:
    branches:
      - feat/ez1-unique-units-v2
    paths:
      - .github/workflows/apply-predator-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ez1-unique-units-v2
      - name: Apply compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manhack = Path("game/server/ez1/weapon_ManhackToss.cpp")
          text = manhack.read_text()
          old = "\tPlayerManhacks->ShouldFollowPlayer(true);"
          new = "\t// This engine marks hacked manhacks as player allies through the interaction hook.\n\tPlayerManhacks->NotifyInteraction(NULL);"
          if old not in text:
              raise SystemExit("Manhack compatibility target not found")
          manhack.write_text(text.replace(old, new, 1))

          header = Path("game/server/ez2/npc_basepredator.h")
          text = header.read_text()
          old = "\tbool\t\t\tShouldInvestigateSounds( void ) { return !m_bIsBaby || BaseClass::ShouldInvestigateSounds(); }\t// 1upD - Adult predators always investigate sounds\n\tvirtual bool\tShouldAvoidGoo( void ) { return m_tEzVariant != EZ_VARIANT_RAD; } // Don't avoid goo if the slime variant"
          new = "\tbool\t\t\tShouldInvestigateSounds( void ) { return !m_bIsBaby; }\t// Adult predators investigate sounds; this base has no equivalent hook.\n\tvirtual bool\tShouldAvoidGoo( void ) { return true; } // EZ2 radiation variants are unavailable in this engine branch."
          if old not in text:
              raise SystemExit("Predator header compatibility target not found")
          header.write_text(text.replace(old, new, 1))

          source = Path("game/server/ez2/npc_basepredator.cpp")
          text = source.read_text()
          text, include_count = re.subn(r'^#include "pointhurt\.h"\n', '', text, count=1, flags=re.M)
          if include_count != 1:
              raise SystemExit("pointhurt include target not found")
          text, block_count = re.subn(
              r'\n#ifdef EZ\n.*?\n#endif // EZ\n',
              '\n\t\t// EZ2 radiation-variant goo is unavailable in this engine branch.\n',
              text,
              count=1,
              flags=re.S,
          )
          if block_count != 1:
              raise SystemExit("EZ2 radiation block target not found")
          source.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/server/ez1/weapon_ManhackToss.cpp game/server/ez2/npc_basepredator.h game/server/ez2/npc_basepredator.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Manhack and predator engine compatibility"
          git push origin HEAD:feat/ez1-unique-units-v2
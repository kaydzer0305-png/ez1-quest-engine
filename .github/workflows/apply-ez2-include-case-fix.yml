name: apply-ez2-include-case-fix

on:
  push:
    branches:
      - feat/ez1-unique-units-v2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Correct case-sensitive AI includes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game/server/ez2/npc_basepredator.cpp')
          text = path.read_text()
          replacements = {
              '#include "AI_Hint.h"': '#include "ai_hint.h"',
              '#include "AI_Senses.h"': '#include "ai_senses.h"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('Expected include was not found')
          path.write_text(text)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game/server/ez2/npc_basepredator.cpp
          git commit -m "Fix EZ2 AI include filename casing"
          git push origin HEAD:feat/ez1-unique-units-v2

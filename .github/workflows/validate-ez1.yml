name: validate-ez1

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  android-arm64-ez1:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure and build EZ1 with diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          OPENXR_AAR_VERSION: "1.0.34"
        run: |
          set -uo pipefail

          run_validation() {
            set -euxo pipefail

            echo '::group::Checkout top-level dependencies'
            git submodule sync
            git submodule update --init --depth 1
            echo '::endgroup::'

            echo '::group::Install Android NDK r20b'
            wget https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
            unzip -q android-ndk-r20b-linux-x86_64.zip
            export ANDROID_NDK_HOME="$GITHUB_WORKSPACE/android-ndk-r20b"
            echo '::endgroup::'

            echo '::group::Install OpenXR loader'
            AAR="openxr_loader_for_android-${OPENXR_AAR_VERSION}.aar"
            MAVEN_SCHEME=https
            MAVEN_HOST=repo1.maven.org
            MAVEN_PATH="maven2/org/khronos/openxr/openxr_loader_for_android/${OPENXR_AAR_VERSION}/${AAR}"
            wget "${MAVEN_SCHEME}://${MAVEN_HOST}/${MAVEN_PATH}"
            unzip -q "$AAR" -d openxr-aar
            INC=$(dirname "$(find openxr-aar -name openxr.h | head -1)")
            SO="openxr-aar/prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so"
            test -n "$INC"
            test -f "$SO"
            mkdir -p external/openxr/include/openxr external/openxr/lib/aarch64
            cp "$INC"/*.h external/openxr/include/openxr/
            cp "$SO" external/openxr/lib/aarch64/
            echo '::endgroup::'

            echo '::group::Configure EZ1'
            ./waf configure -T release --android=aarch64,4.9,24 --togles --disable-warns --build-games=ez1
            echo '::endgroup::'

            echo '::group::Build EZ1'
            ./waf build
            echo '::endgroup::'
          }

          run_validation 2>&1 | tee validate-ez1.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo '## EZ1 Android validation failure'
                echo
                echo '```text'
                tail -n 180 validate-ez1.log
                echo '```'
              } > pr-build-failure.md
              gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-build-failure.md || true
            fi
            exit "$status"
          fi

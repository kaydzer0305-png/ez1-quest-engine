name: import-ez1-units

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ez1-unique-units
          fetch-depth: 0

      - name: Clone entropy-zero/source-sdk-2013 @ EZ1v4.0
        run: |
          set -euo pipefail
          git clone --branch EZ1v4.0 --depth 1 https://github.com/entropy-zero/source-sdk-2013.git /tmp/source-sdk-2013
          echo "SDK HEAD=$(git -C /tmp/source-sdk-2013 rev-parse HEAD)"
          test -d /tmp/source-sdk-2013/sp/src/game/server/ez1

      - name: Copy unique units (no shared HL2 rewrites)
        run: bash scripts/import-ez1-sources.sh /tmp/source-sdk-2013

      - name: Record import provenance
        run: |
          set -euo pipefail
          SHA=$(git -C /tmp/source-sdk-2013 rev-parse HEAD)
          mkdir -p docs
          cat > docs/ez1-unique-units.md <<EOF
          # EZ1v4.0 unique units

          Imported by \`scripts/import-ez1-sources.sh\` from
          [entropy-zero/source-sdk-2013](https://github.com/entropy-zero/source-sdk-2013)
          tag \`EZ1v4.0\` (\`$SHA\`).

          Source only — no VPKs, maps, or Steam content.
          Compiled only when \`--build-games=ez1\` (CI default stays \`hl2\`).

          ## Tree

          - \`game/server/ez1/\` — Manhack toss + EZ achievements
          - \`game/server/ez2/\` — bullsquid / zombigaunt / predator / command point
          - \`game/server/mod/\` — custom NPCs and weapons referenced by EZ1 FGDs
          - \`game/server/Human_Error/\` + \`game/client/Human_Error/\` — drivable APC
          - \`game/client/particles_ez.{cpp,h}\`

          See \`game/server/server_ez1_extras.vpc\` and \`game/client/client_ez1_extras.vpc\`.
          EOF
          # strip leading spaces from heredoc above if any — rewrite cleanly
          python3 - <<'PY'
          from pathlib import Path
          sha = open('/tmp/source-sdk-2013/.git/HEAD').read().strip() if False else None
          PY
          SHA=$(git -C /tmp/source-sdk-2013 rev-parse HEAD)
          cat > docs/ez1-unique-units.md <<EOF
          # EZ1v4.0 unique units

          Imported by \`scripts/import-ez1-sources.sh\` from
          [entropy-zero/source-sdk-2013](https://github.com/entropy-zero/source-sdk-2013)
          tag \`EZ1v4.0\` (\`$SHA\`).

          Source only — no VPKs, maps, or Steam content.
          Compiled only when \`--build-games=ez1\` (CI default stays \`hl2\`).

          ## Tree

          - \`game/server/ez1/\` — Manhack toss + EZ achievements
          - \`game/server/ez2/\` — bullsquid / zombigaunt / predator / command point
          - \`game/server/mod/\` — custom NPCs and weapons referenced by EZ1 FGDs
          - \`game/server/Human_Error/\` + \`game/client/Human_Error/\` — drivable APC
          - \`game/client/particles_ez.{cpp,h}\`

          See \`game/server/server_ez1_extras.vpc\` and \`game/client/client_ez1_extras.vpc\`.
          EOF

      - name: Commit if dirty
        run: |
          set -euo pipefail
          git config user.name kaydzer0305-png
          git config user.email kaydzer0305@gmail.com
          git add \
            game/server/ez1 \
            game/server/ez2 \
            game/server/mod \
            game/server/Human_Error \
            game/client/Human_Error \
            game/client/particles_ez.cpp \
            game/client/particles_ez.h \
            docs/ez1-unique-units.md
          if git diff --cached --quiet; then
            echo no unique-unit changes
          else
            git commit -m "Import EZ1v4.0 unique units (source only, extras.vpc list)"
            git push origin feat/ez1-unique-units
          fi
